name: Periphery

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    uses: RISCfuture/ci-workflows/.github/workflows/minerva-route.yml@1.1.0
    permissions:
      contents: read

  periphery:
    name: Run Periphery
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.xcode-27) }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: "27"
      - uses: actions/checkout@v7.0.1

      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install Periphery
        run: brew install periphery-pro/tap/periphery-cli

      # Periphery reads the package in SwiftPM mode; it cannot parse Xcode's JSON project format,
      # so the scan covers LogbookKit, where the app's logic lives.
      - name: Run Periphery
        working-directory: Packages/LogbookKit
        env:
          PERIPHERY_TOKEN: ${{ secrets.PERIPHERY_TOKEN }}
        run: periphery scan --strict --config ../../.periphery.yml
